name: Build and Package for Release

# A published release gets the NuGet packages plus two zips: the standard assemblies and the
# internal-DllImport (Unity/iOS) build. See eng/pack-release-artefacts.sh.

on:
  release:
    types:
      - published
  workflow_dispatch:

# gh release upload needs write access to the release.
permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ManagedBass.sln

      - name: Build
        run: dotnet build src/ManagedBass.sln -c Release --no-restore

      # Tier 0's package-shape test reads artifacts/packages; without -o it skips.
      - name: Pack
        run: dotnet pack src/ManagedBass.sln -c Release --no-build -o artifacts/packages

      # Must precede the metadata tests, which skip the internal-DllImport group when the output is absent.
      - name: Build (internal DllImport, Unity/iOS variant)
        run: dotnet build src/ManagedBass.Shipping.slnf -c Release -p:BassInternalDllImport=true

      - name: Test (metadata and package shape)
        run: dotnet test tests/ManagedBass.Metadata.Tests -c Release

  build-and-deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        run: |
          REF="${{ github.ref }}"
          if [[ $REF == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="1.0.0"
          fi
          echo "Using version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/ManagedBass.sln

      - name: Build
        run: dotnet build src/ManagedBass.sln -c Release --no-restore -p:Version=$VERSION

      - name: Create Release NuGet package
        run: dotnet pack src/ManagedBass.sln -v normal -c Release --no-build -p:PackageVersion=$VERSION -o src/nupkg

      - name: Build (internal DllImport, Unity/iOS variant)
        run: dotnet build src/ManagedBass.Shipping.slnf -c Release -p:BassInternalDllImport=true -p:Version=$VERSION

      - name: Collect release artefacts
        run: bash eng/pack-release-artefacts.sh "$VERSION" artifacts/release

      - name: Upload Packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: src/nupkg/*.*
          retention-days: 5

      - name: Upload release zips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: artifacts/release/*.zip
          retention-days: 5

      # --clobber so a re-run replaces the assets instead of failing on "already exists".
      - name: Attach zips to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "artifacts/release/ManagedBass-$VERSION-dotnet.zip"
          "artifacts/release/ManagedBass-$VERSION-unity-ios.zip"
          --clobber

      - name: Push to NuGet Feed
        if: github.event_name == 'release'
        working-directory: ${{ github.workspace }}/src/nupkg
        run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ secrets.NUGET_KEY }}
