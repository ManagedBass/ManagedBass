name: iOS Simulator

# Tier 2: runs the ManagedBass.Ios.Harness app on a simulator and requires 'outcome=PASS', in two variants.
#
# standard           - the harness contains no resolver registration of its own, so a pass proves the
#                      buildTransitive module initialiser in src/Bass/Portable/build/ registered
#                      ManagedBass.NativeLibraryResolver.
# internal-dllimport - Tier 2b, built with -p:BassInternalDllImport=true, so every DllName is "__Internal"
#                      and no resolver is registered at all. A pass proves the linker bound the symbols to
#                      the embedded bass.framework, the only lookup Unity/IL2CPP on iOS can do. It is the
#                      one run of the assemblies ManagedBass-<version>-unity-ios.zip ships.

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/ManagedBass.Ios.Harness/**'
      - 'eng/**'
      - '.github/workflows/ios-simulator.yml'
      - 'tests/Directory.Build.props'
      - 'global.json'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ManagedBass.Ios.Harness/**'
      - 'eng/**'
      - '.github/workflows/ios-simulator.yml'
      - 'tests/Directory.Build.props'
      - 'global.json'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  HARNESS_PROJECT: tests/ManagedBass.Ios.Harness
  RESULT_MARKER: 'MANAGEDBASS_RESULT:'
  RESULT_TIMEOUT_SECONDS: 180

jobs:
  ios-simulator:
    name: ios-simulator (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 60
    # Advisory until it has run green on real runners for a while; then drop this and make it required.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            build_args: ''
            app_bundle: tests/ManagedBass.Ios.Harness/bin/Release/net10.0-ios/iossimulator-arm64/ManagedBassIosHarness.app
            bundle_id: com.managedbass.harness.ios
            process: ManagedBassIosHarness
            expected_mode: 'dllimportmode=standard'
          - variant: internal-dllimport
            build_args: '-p:BassInternalDllImport=true'
            app_bundle: tests/ManagedBass.Ios.Harness/bin/internaldllimport/Release/net10.0-ios/iossimulator-arm64/ManagedBassIosHarnessInternal.app
            bundle_id: com.managedbass.harness.ios.internaldllimport
            process: ManagedBassIosHarnessInternal
            expected_mode: 'dllimportmode=internal'
    env:
      BUILD_ARGS: ${{ matrix.build_args }}
      APP_BUNDLE: ${{ matrix.app_bundle }}
      BUNDLE_ID: ${{ matrix.bundle_id }}
      PROCESS_NAME: ${{ matrix.process }}
      EXPECTED_MODE: ${{ matrix.expected_mode }}
      LOG_DIR: artifacts/ios-harness/${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        timeout-minutes: 20
        run: dotnet workload install ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          dotnet --version

      # The point of the tier is the automatic path; a hand-registered resolver would make a pass meaningless.
      # The internal-dllimport variant goes further and turns the injected registration off in the csproj, so
      # its pass rests on __Internal symbol lookup alone; the harness asserts the slot really was left free.
      - name: Assert the harness registers nothing itself
        run: |
          if grep -rn 'NativeLibraryResolver' "$HARNESS_PROJECT" --include='*.cs' --include='*.csproj'; then
            echo "::error::$HARNESS_PROJECT references NativeLibraryResolver; Tier 2 must rely on the injected initialiser only."
            exit 1
          fi
          echo "No NativeLibraryResolver reference in the harness."

      - name: Cache BASS downloads
        uses: actions/cache@v4
        with:
          path: artifacts/downloads
          key: bass-downloads-ios-${{ hashFiles('eng/bass-manifest.json') }}

      # No fetch step: building the harness fetches artifacts/natives/ios itself.
      - name: Build the harness
        timeout-minutes: 15
        run: |
          mkdir -p "$LOG_DIR"
          # Unquoted on purpose: BUILD_ARGS is empty for the standard variant.
          dotnet build "$HARNESS_PROJECT" -c Release $BUILD_ARGS -v:n -bl:"$LOG_DIR/harness-build.binlog"

      # A missing framework is a packaging failure; check it before any dllnotfound can be misread.
      - name: Check bass.framework is in the bundle
        run: |
          [ -d "$APP_BUNDLE" ] || { echo "::error::$APP_BUNDLE was not produced"; find "$HARNESS_PROJECT/bin" -maxdepth 5 -type d; exit 1; }
          ls -l "$APP_BUNDLE/Frameworks" || true
          if [ ! -d "$APP_BUNDLE/Frameworks/bass.framework" ]; then
            echo "::error::bass.framework is not embedded in the bundle. Packaging failure, not a resolver regression."
            exit 1
          fi

      - name: Boot a simulator
        run: |
          selected=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-")) | .key as $rt
              | .value[] | select(.name | startswith("iPhone")) | { rt: $rt, udid: .udid, name: .name } ]
            | sort_by(.rt) | last | if . == null then empty else "\(.udid)\t\(.name)\t\(.rt)" end')
          [ -n "$selected" ] || { echo "::error::No available iPhone simulator"; xcrun simctl list devices available; exit 1; }
          echo "Selected: $selected"
          udid=${selected%%$'\t'*}
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Install the app
        run: xcrun simctl install "$SIM_UDID" "$APP_BUNDLE"

      - name: Run the harness
        run: |
          mkdir -p "$LOG_DIR"
          xcrun simctl spawn "$SIM_UDID" log stream --style compact \
            --predicate "processImagePath CONTAINS \"$PROCESS_NAME\"" > "$LOG_DIR/log-stream.txt" 2>&1 &
          log_pid=$!
          xcrun simctl launch --console-pty "$SIM_UDID" "$BUNDLE_ID" > "$LOG_DIR/console.txt" 2>&1 &
          launch_pid=$!
          deadline=$((SECONDS + RESULT_TIMEOUT_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            grep -qs "$RESULT_MARKER outcome=" "$LOG_DIR"/*.txt && break
            kill -0 "$launch_pid" 2>/dev/null || break
            sleep 2
          done
          kill "$log_pid" "$launch_pid" 2>/dev/null || true
          wait "$log_pid" "$launch_pid" 2>/dev/null || true
          echo "--- console.txt ---"; cat "$LOG_DIR/console.txt" || true
          echo "--- log-stream.txt ---"; cat "$LOG_DIR/log-stream.txt" || true

      # Lines arrive twice (stdout + NSLog) and CRLF-terminated (--console-pty is a terminal): strip CR,
      # de-duplicate, and never anchor with $.
      - name: Evaluate the result
        run: |
          results=$( { grep -ahos "$RESULT_MARKER.*" "$LOG_DIR"/*.txt || true; } \
            | sed "s/^.*$RESULT_MARKER *//" | tr -d '\r' | sed 's/[[:space:]]*$//' | awk 'NF && !seen[$0]++' )
          { echo "### iOS simulator harness (${{ matrix.variant }})"; echo; echo '```'; echo "${results:-<no result lines>}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$results"
          if [ -z "$results" ]; then
            echo "::error::No $RESULT_MARKER lines within ${RESULT_TIMEOUT_SECONDS}s; the app most likely failed to launch. No evidence is a failure."
            exit 1
          fi
          # Both variants pass on the same markers, so check the app that ran is the one this leg built.
          if ! echo "$results" | grep -qx "$EXPECTED_MODE"; then
            echo "::error::Expected '$EXPECTED_MODE' in the results; the wrong bundle ran, so this leg proves nothing about ${{ matrix.variant }}."
            exit 1
          fi
          if echo "$results" | grep -q '^outcome=PASS'; then
            echo "iOS simulator harness passed."
            exit 0
          fi
          reason=$(echo "$results" | sed -n 's/^outcome=FAIL reason=//p' | head -n 1)
          case "$reason" in
            dllnotfound)
              if [ "$EXPECTED_MODE" = 'dllimportmode=internal' ]; then
                echo "::error::DllNotFoundException with bass.framework embedded and DllName=__Internal: symbol lookup in the app executable has regressed, which is what Unity on iOS depends on."
              else
                echo "::error::DllNotFoundException with bass.framework embedded: the automatic resolver registration has regressed. Check probe.resolverslotfree and that ManagedBass.targets still contributes ManagedBassNativeResolverInitialiser.cs."
              fi ;;
            resolverregistered)
              echo "::error::A DllImportResolver was registered in the internal-DllImport variant, so the pass would not have been evidence about __Internal lookup. Check ManagedBassRegisterNativeResolver in the harness csproj." ;;
            predicates)
              echo "::error::A CrossPlatformHelper predicate is wrong on iOS; see failedpredicates=. The internal-DllImport variant is netstandard2.0, where every predicate is expected to be false." ;;
            "")
              echo "::error::Result lines were emitted but no outcome=PASS; the run did not complete." ;;
            *)
              echo "::error::iOS simulator harness failed: $reason" ;;
          esac
          exit 1

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-harness-logs-${{ matrix.variant }}
          path: ${{ env.LOG_DIR }}
          retention-days: 14
          if-no-files-found: warn

      - name: Shut the simulator down
        if: always()
        run: |
          [ -n "${SIM_UDID:-}" ] && xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl shutdown all 2>/dev/null || true
